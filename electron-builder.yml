appId: net.odiak.bckle
productName: bckle
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - docs/format-v1.md
  - package.json
# アイコンは scripts/generate-icon.mjs で生成した build/icon.png を
# electron-builderが各プラットフォーム形式（icns/ico）に変換する
icon: build/icon.png
mac:
  target:
    - target: dmg
      arch: universal
  category: public.app-category.developer-tools
  hardenedRuntime: true
  # 公証はAPPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID が
  # 設定されている場合のみ実行される（未設定ならスキップされ未署名/未公証ビルド）。
  # 署名はCSC_LINK / CSC_KEY_PASSWORD（CI）またはローカルのキーチェーン。
  notarize: true
win:
  target:
    - target: nsis
      arch: x64
  # Windowsは当面未署名のベストエフォート配布（SmartScreen警告あり）
nsis:
  oneClick: true
  deleteAppDataOnUninstall: true
npmRebuild: false
# 自動publishは使わない（CIのタグ検出でGitHubへpublishしようとしてGH_TOKEN必須になるため。
# Releasesへの添付はワークフロー側の softprops/action-gh-release で行う）
publish: null
